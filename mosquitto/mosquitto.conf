# Everyone must log in. Three doors:
#   1883  plain, inside docker only: used by the backend containers
#   9001  websocket, inside docker only: used by the plant scripts (Caddy puts the encryption in front of it, port 443)
#   8883  MQTT over TLS, open to the internet: the customers' own gateways (V2.0). Added by entrypoint.sh as soon as the https certificate
#         that Caddy fetched for the server's name exists (the broker uses the SAME certificate).
# The static logins (backend, old plant scripts) are in /mosquitto/passwd + the acl file. The logins of the customers' gateways are made
# and removed live by the cloud with the Dynamic Security plugin (entrypoint.sh loads the plugin); each one may touch only its own two topics.
allow_anonymous false
password_file /mosquitto/passwd
acl_file /mosquitto/config/acl
persistence true
# A busy server must never lose a reading: the broker keeps up to a million waiting messages for the app (the default is only 1000,
# the rest would be dropped). Memory used is about 0.5 KB per waiting reading.
max_queued_messages 1000000
max_inflight_messages 20000
persistence_location /mosquitto/data/
# A customer gateway may send big messages (a Sparkplug birth with hundreds of points) but never megabytes.
max_packet_size 262144

listener 1883
listener 9001
protocol websockets
