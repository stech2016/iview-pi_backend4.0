# OPTIONAL server health watch (Uptime Kuma, MIT). Start:  podman compose -f docker-compose.yml -f deploy/docker-compose.monitor.yml up -d
# Open http://<server>:3001 (from the server itself or through an SSH tunnel) and add a monitor for https://<your-domain>/api/v1/healthz
services:
  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:1
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3001"]
    volumes: ["kumadata:/app/data"]
volumes:
  kumadata:
